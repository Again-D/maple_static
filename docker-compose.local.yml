services:
  backend:
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maple_growth
      POSTGRES_USER: maple
      POSTGRES_PASSWORD: maple
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maple -d maple_growth"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
