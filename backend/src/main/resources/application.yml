spring:
  application:
    name: maple-growth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:maple_growth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
server:
  port: ${SERVER_PORT:8080}
app:
  timezone: ${APP_TIMEZONE:Asia/Seoul}
  snapshot-cron: ${APP_SNAPSHOT_CRON:0 0 4 * * *}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  nexon-base-url: ${APP_NEXON_BASE_URL:https://open.api.nexon.com}
  nexon-timeout-seconds: ${APP_NEXON_TIMEOUT_SECONDS:10}
  scheduler-duplicate-wait-seconds: ${APP_SCHEDULER_DUPLICATE_WAIT_SECONDS:300}
  operations-api-token: ${APP_OPERATIONS_API_TOKEN:}
  collection:
    retry-cron: ${APP_COLLECTION_RETRY_CRON:0 */15 * * * *}
    retry-batch-size: ${APP_COLLECTION_RETRY_BATCH_SIZE:20}
    retry-max-attempts: ${APP_COLLECTION_RETRY_MAX_ATTEMPTS:3}
    retry-initial-backoff-seconds: ${APP_COLLECTION_RETRY_INITIAL_BACKOFF_SECONDS:300}
    retry-lease-seconds: ${APP_COLLECTION_RETRY_LEASE_SECONDS:900}
nexon:
  api-key: ${NEXON_API_KEY:test-key}
