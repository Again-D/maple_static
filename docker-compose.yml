services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env.supabase
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_APP_TIMEZONE: Asia/Seoul
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped
