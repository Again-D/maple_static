services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maple_growth
      POSTGRES_USER: maple
      POSTGRES_PASSWORD: maple
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maple -d maple_growth"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      NEXON_API_KEY: ${NEXON_API_KEY:-test-key}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/maple_growth
      SPRING_DATASOURCE_USERNAME: maple
      SPRING_DATASOURCE_PASSWORD: maple
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      APP_TIMEZONE: Asia/Seoul
      APP_SNAPSHOT_CRON: 0 0 4 * * *
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_NEXON_BASE_URL: https://open.api.nexon.com
      APP_NEXON_TIMEOUT_SECONDS: 10
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_APP_TIMEZONE: Asia/Seoul
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
